version: v2
clean: true
inputs:
  - directory: ../proto
    # This will remove these types from the output entirely so you don't need to worry about leaking sql schema
    exclude_types:
      - protoutil.sql.v1
  # buf/validate is deliberately absent: it is consumed from
  # @bufbuild/protovalidate via map_imports rather than regenerated here.
  - module: buf.build/googleapis/googleapis
    paths:
      - google/api/field_behavior.proto
      - google/api/resource.proto
plugins:
  - local: ../../node_modules/.bin/protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=.js
      - ts_nocheck=false
      - map_imports=buf/validate/:@bufbuild/protovalidate/gen
