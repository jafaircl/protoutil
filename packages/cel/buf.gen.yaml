version: v2
clean: true
inputs:
  - directory: proto
  - module: buf.build/googleapis/googleapis:c17df5b2beca46928cc87d5656bd5343
    paths:
      - google/api/expr/v1alpha1/eval.proto
plugins:
  - local: ../../node_modules/.bin/protoc-gen-es
    out: src/gen
    include_imports: true
    opt:
      - target=ts
      - import_extension=.js
      - ts_nocheck=false
