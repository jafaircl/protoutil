language: 'javascript'

tasks:
  protogen:
    command: 'pnpm run protogen'
    inputs:
    - 'proto/**/*'
    - 'buf.yaml'
    - 'buf.gen.yaml'
    outputs:
    - 'src/gen'
  sync-testdata:
    command: 'pnpm run sync:testdata'
    inputs:
    - 'scripts/cel-conformance-sync/**/*.go'
    - 'scripts/cel-go-test-sync/**/*.go'
    outputs:
    - 'testdata/cel-go/cel-go-test-cases.json'
    - 'testdata/cel-go/cel-go-test-cases.report.json'
    - 'testdata/conformance/*.json'
  typecheck:
    command: 'pnpm run typecheck'
    dependsOn:
    - protogen
    inputs:
    - '@globs(sources)'
    - 'tsconfig.json'
  benchmark:
    command: 'pnpm run benchmark'
    dependsOn:
    - typecheck
    - check
    inputs:
    - '@globs(sources)'
    - 'src/**/benchmark.spec.ts'
    - 'scripts/benchmark-cel-go/**/*.go'
    outputs:
    - 'BENCHMARK.md'
  test:
    command: 'pnpm run test'
    dependsOn:
    - sync-testdata
    - format
    - typecheck
    - check
    inputs:
    - '@globs(sources)'
    - '@globs(tests)'
  build:
    command: 'pnpm run build'
    dependsOn:
    - test
    inputs:
    - '@globs(sources)'
    - 'tsdown.config.ts'
    outputs:
    - 'dist'
  pack:
    command: 'pnpm pack'
    dependsOn:
    - build
