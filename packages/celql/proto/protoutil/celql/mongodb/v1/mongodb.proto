// Output schema for the MongoDB dialect profile.
//
// The profile translates a checked CEL expression into one MongoDB filter
// document. The document is encoded as a CEL value so the profile preserves
// CEL scalar types without depending on a MongoDB driver.

syntax = "proto3";

package protoutil.celql.mongodb.v1;

import "cel/expr/value.proto";

// One MongoDB filter document emitted by the MongoDB profile.
//
// The message is independent of a MongoDB driver. A driver integration converts
// the typed CEL value tree to its driver document only at the database boundary.
message MongoDbPredicate {
  // The complete MongoDB filter document as a CEL map value.
  //
  // String map keys are MongoDB field names or fixed MongoDB operators. CEL
  // constants are represented as typed CEL values and never as raw query text.
  cel.expr.Value filter = 1;
}
